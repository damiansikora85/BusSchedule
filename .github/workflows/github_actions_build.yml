name: windowsCI

on:
  push:
    branches: [ ]
  pull_request:
    branches: [ ]
  workflow_dispatch:

env:
  DOTNETVERSION: 9.0.x

jobs:
  buildAndroid:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNETVERSION }}

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'microsoft'

      - name: Install .NET MAUI workloads
        run: dotnet workload install maui

      - name: List installed .NET info
        run: dotnet --info

      - name: Restore NuGet packages
        run: dotnet restore BusSchedule.sln

      - name: Setup project secrets
        shell: pwsh
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYS: ${{ secrets.KEYS_FILE }}
        run: |
          [System.IO.File]::WriteAllBytes('BusScheduleMaui/Platforms/Android/google-services.json', [System.Convert]::FromBase64String($env:DATA))
          Set-Content -Path 'BusScheduleMaui/Platforms/Android/Resources/values/keys.xml' -Value $env:KEYS

      - name: Create Keystore file
        uses: timheuer/base64-to-file@v1
        with:
          fileName: "keystore.jks"
          fileDir: "BusScheduleMaui/Platforms/Android/"
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Get Version
        shell: pwsh
        run: |
          $version = 150 + [int]$env:GITHUB_RUN_NUMBER
          echo "VERSION_NUMBER=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf-8 -Append

      - name: Set version
        uses: damienaicheh/update-android-version-manifest-action@v1.0.0
        with:
          android-manifest-path: './BusScheduleMaui/Platforms/Android/AndroidManifest.xml'
          version-code: ${{ env.VERSION_NUMBER }}
          print-file: true
          version-name: '6.0'

      - name: Build
        run: >
          dotnet build BusScheduleMaui/BusScheduleMaui.csproj -c Release
          /p:AndroidKeyStore=true
          /p:AndroidSigningKeyStore=Platforms/Android/keystore.jks
          /p:AndroidSigningKeyAlias=${{ secrets.KEYSTORE_ALIAS }}
          /p:AndroidSigningKeyPass=${{ secrets.KEYSTORE_PASS }}
          /p:AndroidSigningStorePass=${{ secrets.KEYSTORE_ALIAS_PASS }}
          --no-restore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bundle
          path: BusScheduleMaui/bin/Release/net9.0-android/com.darktower.bus-Signed.aab
          retention-days: 5

      - name: Upload build to Google Play
        uses: KevinRohn/github-action-upload-play-store@v1.0.0
        with:
          service_account_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          package_name: "com.darktower.bus"
          aab_file_path: "BusScheduleMaui/bin/Release/net9.0-android/com.darktower.bus-Signed.aab"
          track: "beta"
          release_status: "draft"